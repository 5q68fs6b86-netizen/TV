name: Build TV Debug APKs (No Proguard)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-no-minify

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Grant gradlew permission
      run: chmod +x ./gradlew

    - name: Disable minify for release (if release-no-minify)
      if: ${{ github.event.inputs.build_type == 'release-no-minify' }}
      run: |
        # Temporarily disable minify in build.gradle
        sed -i 's/minifyEnabled true/minifyEnabled false/g' app/build.gradle
        sed -i 's/shrinkResources true/shrinkResources false/g' app/build.gradle

    - name: Build TV Debug APKs
      if: ${{ github.event.inputs.build_type == 'debug' }}
      run: |
        sed -i '/org.gradle.java.home/d' gradle.properties
        ./gradlew assembleTvJavaArm64_v8aDebug
        ./gradlew assembleTvJavaArmeabi_v7aDebug

    - name: Build TV Release APKs (No Minify)
      if: ${{ github.event.inputs.build_type == 'release-no-minify' }}
      run: |
        sed -i '/org.gradle.java.home/d' gradle.properties
        ./gradlew assembleTvJavaArm64_v8aRelease
        ./gradlew assembleTvJavaArmeabi_v7aRelease

    - name: List APKs
      run: |
        find app/build/outputs/apk -name "*.apk" -type f

    - name: Upload Debug APKs
      if: ${{ github.event.inputs.build_type == 'debug' }}
      uses: actions/upload-artifact@v4
      with:
        name: tv-debug-apks
        path: app/build/outputs/apk/**/debug/*.apk
        retention-days: 7

    - name: Upload Release APKs (No Minify)
      if: ${{ github.event.inputs.build_type == 'release-no-minify' }}
      uses: actions/upload-artifact@v4
      with:
        name: tv-release-no-minify-apks
        path: app/build/outputs/apk/**/release/*.apk
        retention-days: 7
