name: Compile Check

# No signing secrets required — only verifies Java/Kotlin compile for leanback arm64 debug.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/**
      - fix/**

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Checkout Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: release-1.10.1-fongmi
          path: .media3
          fetch-depth: 1

      - name: Limit Media3 composite modules
        run: cp .github/media3-composite-settings.gradle .media3/settings.gradle

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Compile leanback arm64 debug (Java + Kotlin)
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
        run: |
          ./gradlew :app:compileLeanbackArm64_v8aDebugJavaWithJavac \
            --no-daemon --build-cache --max-workers=2 --console=plain
