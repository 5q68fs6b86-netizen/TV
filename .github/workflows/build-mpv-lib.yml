name: Build mpv-android-lib AAR

# Same-source AAR: marlboro-advance/mpvlibAndroid (extended JNI matching TV's MpvPlayer)
# + wobuhui666/mpv (fongmi) as the libmpv core (vulkan / HDR path).
#
# This replaces the broken hybrid graft (new libmpv + old libplayer) which caused
# black screens / exit hangs from ABI mismatch.

on:
  workflow_dispatch:
    inputs:
      mpv_git_url:
        description: "libmpv git URL"
        required: true
        default: "https://github.com/wobuhui666/mpv"
      mpv_ref:
        description: "libmpv ref (branch/tag/sha)"
        required: true
        default: "fongmi"
      mpvlib_android_ref:
        description: "marlboro-advance/mpvlibAndroid ref (JNI + classes.jar source)"
        required: true
        default: "library"
      aar_version:
        description: "Output AAR version suffix"
        required: true
        default: "0.0.6"
      arches:
        description: "Space-separated arches for buildall (arm64 armv7l ...)"
        required: true
        default: "arm64 armv7l"
      publish_release:
        description: "Publish GitHub Release (true/false)"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout mpvlibAndroid (extended JNI)
        uses: actions/checkout@v4
        with:
          repository: marlboro-advance/mpvlibAndroid
          ref: ${{ inputs.mpvlib_android_ref }}
          path: mpvlib
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build cmake python3-pip gperf nasm yasm binutils
          sudo pip3 install --break-system-packages meson || sudo pip3 install meson

      - name: Export cache id
        working-directory: mpvlib
        run: |
          chmod +x buildscripts/include/ci.sh buildscripts/download.sh buildscripts/buildall.sh
          # ci.sh export may assume certain layout; still useful for CACHE_IDENTIFIER
          if buildscripts/include/ci.sh export >>"$GITHUB_ENV" 2>/dev/null; then
            echo "ci export ok"
          else
            echo "CACHE_IDENTIFIER=mpvlib-${{ inputs.mpv_ref }}-${{ inputs.mpvlib_android_ref }}" >>"$GITHUB_ENV"
          fi

      - name: Cache native prefix
        uses: actions/cache@v4
        with:
          path: mpvlib/buildscripts/prefix
          key: mpvlib-prefix-${{ inputs.mpv_ref }}-${{ inputs.mpvlib_android_ref }}-${{ inputs.arches }}
          restore-keys: |
            mpvlib-prefix-${{ inputs.mpv_ref }}-
            mpvlib-prefix-

      - name: Patch download-deps to use wobuhui666/mpv
        working-directory: mpvlib
        env:
          MPV_GIT_URL: ${{ inputs.mpv_git_url }}
          MPV_GIT_REF: ${{ inputs.mpv_ref }}
        run: |
          set -euo pipefail
          # Replace stock mpv-player/mpv clone with our fork + pin ref.
          # Original:
          #   [ ! -d mpv ] && git clone https://github.com/mpv-player/mpv
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("buildscripts/include/download-deps.sh")
          text = p.read_text()
          url = os.environ["MPV_GIT_URL"]
          ref = os.environ["MPV_GIT_REF"]
          block = f'''# mpv (patched by TV build-mpv-lib.yml)
          if [ ! -d mpv ]; then
          	git clone "{url}" mpv
          	git -C mpv checkout "{ref}"
          else
          	# Ensure CI cache reuse still ends on requested ref
          	git -C mpv fetch --depth 1 origin "{ref}" || git -C mpv fetch origin "{ref}" || true
          	git -C mpv checkout "{ref}" || git -C mpv checkout FETCH_HEAD || true
          fi
          '''
          import re
          text2, n = re.subn(
              r"# mpv\n\[ ! -d mpv \] && git clone https://github.com/mpv-player/mpv\n",
              block + "\n",
              text,
              count=1,
          )
          if n != 1:
              # fallback: append override after any mpv clone line
              if "git clone" in text and "mpv-player/mpv" in text:
                  text2 = text.replace(
                      "[ ! -d mpv ] && git clone https://github.com/mpv-player/mpv",
                      f'if [ ! -d mpv ]; then git clone "{url}" mpv; fi\ngit -C mpv fetch origin "{ref}" || true\ngit -C mpv checkout "{ref}" || true',
                  )
              else:
                  raise SystemExit("could not patch download-deps.sh for custom mpv")
          p.write_text(text2)
          print("patched download-deps.sh for", url, ref)
          PY
          # Also patch ci.sh tarball fetch of mpv master if present
          if grep -q 'mpv-player/mpv/archive' buildscripts/include/ci.sh 2>/dev/null; then
            sed -i "s|https://github.com/mpv-player/mpv/archive/master.tar.gz|${MPV_GIT_URL}/archive/${MPV_GIT_REF}.tar.gz|g" buildscripts/include/ci.sh || true
          fi
          grep -n "mpv" buildscripts/include/download-deps.sh | tail -20

      - name: Download SDK/deps
        working-directory: mpvlib
        env:
          IN_CI: "1"
        run: |
          set -euo pipefail
          # Prefer project's download.sh (pulls NDK/SDK + deps)
          cd buildscripts
          ./download.sh
          # Ensure mpv is on requested ref after download
          if [ -d deps/mpv ]; then
            git -C deps/mpv remote -v || true
            git -C deps/mpv log -1 --oneline || true
          fi

      - name: Build native + AAR
        working-directory: mpvlib
        env:
          GRADLE_OPTS: -Xmx4G
        run: |
          set -euo pipefail
          unset ANDROID_SDK_ROOT || true
          cd buildscripts
          # Build each arch's mpv stack, then package AAR once with -n or final buildall
          for arch in ${{ inputs.arches }}; do
            echo "===== building mpv for $arch ====="
            ./buildall.sh --arch "$arch" mpv
          done
          # Final step builds the Android library AAR (JNI libplayer + package)
          # release.yml uses: ./buildall.sh after arches; build.yml uses ./buildall.sh -n
          if ./buildall.sh -n; then
            echo "buildall -n ok"
          else
            echo "buildall -n failed, try plain buildall"
            ./buildall.sh
          fi
          find ../app/build/outputs -type f -name '*.aar' -ls || true
          find ../app -name 'libplayer.so' | head
          find ../app -name 'libmpv.so' | head

      - name: Verify AAR JNI surface + vulkan
        id: aar
        working-directory: mpvlib
        env:
          AAR_VERSION: ${{ inputs.aar_version }}
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs -type f -name '*.aar' | head -1)
          test -n "$SRC"
          test -f "$SRC"
          OUT="$GITHUB_WORKSPACE/mpv-android-lib-v${AAR_VERSION}.aar"
          cp -f "$SRC" "$OUT"
          STAGE="$GITHUB_WORKSPACE/aar-check"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          unzip -q "$OUT" -d "$STAGE"
          test -f "$STAGE/classes.jar"
          test -f "$STAGE/jni/arm64-v8a/libmpv.so"
          test -f "$STAGE/jni/arm64-v8a/libplayer.so"

          REQUIRED_JNI=(
            Java_is_xyz_mpv_MPVLib_getPropertyNode
            Java_is_xyz_mpv_MPVLib_setPropertyNode
            Java_is_xyz_mpv_MPVLib_commandNode
            Java_is_xyz_mpv_MPVLib_grabThumbnailFast
            Java_is_xyz_mpv_MPVLib_clearThumbnailCache
            Java_is_xyz_mpv_MPVLib_setThumbnailJavaVM
          )
          nm -D "$STAGE/jni/arm64-v8a/libplayer.so" >"$GITHUB_WORKSPACE/nm-libplayer.txt"
          for sym in "${REQUIRED_JNI[@]}"; do
            if ! grep -qE "[[:space:]]T[[:space:]]+${sym}(@@|\$)" "$GITHUB_WORKSPACE/nm-libplayer.txt"; then
              echo "FATAL: libplayer.so missing $sym"
              head -40 "$GITHUB_WORKSPACE/nm-libplayer.txt" || true
              exit 1
            fi
          done
          echo "JNI surface OK (${#REQUIRED_JNI[@]} extended methods)."

          if readelf -d "$STAGE/jni/arm64-v8a/libmpv.so" | grep -q 'libvulkan.so'; then
            echo "libmpv depends on libvulkan.so"
          else
            echo "WARN: libmpv has no libvulkan.so NEEDED entry"
          fi

          {
            echo "Same-source AAR notes"
            echo "====================="
            echo "Output: mpv-android-lib-v${AAR_VERSION}.aar"
            echo "JNI + classes.jar: marlboro-advance/mpvlibAndroid@${{ inputs.mpvlib_android_ref }}"
            echo "libmpv core: ${{ inputs.mpv_git_url }}@${{ inputs.mpv_ref }}"
            echo "Arches: ${{ inputs.arches }}"
            echo ""
            echo "arm64-v8a:"
            ls -lh "$STAGE/jni/arm64-v8a/"
            echo ""
            echo "armeabi-v7a:"
            ls -lh "$STAGE/jni/armeabi-v7a/" 2>/dev/null || echo "(missing)"
          } | tee "$GITHUB_WORKSPACE/INSTALL_MPV_AAR.txt"

          ls -lh "$OUT"
          echo "aar_path=$OUT" >>"$GITHUB_OUTPUT"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-lib-v${{ inputs.aar_version }}
          path: |
            mpv-android-lib-v${{ inputs.aar_version }}.aar
            INSTALL_MPV_AAR.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AAR_VERSION: ${{ inputs.aar_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="mpv-lib-v${AAR_VERSION}"
          AAR="mpv-android-lib-v${AAR_VERSION}.aar"
          NOTES=$(cat INSTALL_MPV_AAR.txt)
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$AAR" INSTALL_MPV_AAR.txt \
            --repo "$REPO" \
            --title "mpv-android-lib v${AAR_VERSION} (same-source mpvlibAndroid + wobuhui666/mpv)" \
            --notes "$NOTES" \
            --latest=false
          echo "Published https://github.com/${REPO}/releases/tag/$TAG"
