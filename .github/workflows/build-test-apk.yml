name: Build Test APK

# Signed test APK for feature validation. Uses repo secrets for a disposable test keystore.
# Pulls mpv-android-lib from release (avoids large binary in git).
# Use same-source AAR (v0.0.6+): hybrid v0.0.4 causes NoSuchMethodError event(I)V.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        default: "feat/mpv-hot-decode-dolby-hdr"
      mpv_aar_url:
        description: "URL of mpv AAR to inject into app/libs"
        required: true
        default: "https://github.com/5q68fs6b86-netizen/TV/releases/download/mpv-lib-v0.0.6/mpv-android-lib-v0.0.6.aar"
      release_tag:
        description: "GitHub release tag to upload APKs"
        required: true
        default: "test-apk-mpv-hot-decode"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Checkout Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: release-1.10.1-fongmi
          path: .media3
          fetch-depth: 1

      - name: Limit Media3 composite modules
        run: cp .github/media3-composite-settings.gradle .media3/settings.gradle

      - name: Inject mpv AAR from release
        run: |
          set -euo pipefail
          mkdir -p app/libs
          rm -f app/libs/mpv-android-lib-*.aar
          curl -fL --retry 5 -o app/libs/mpv-android-lib-v0.0.4.aar "${{ inputs.mpv_aar_url }}"
          ls -lh app/libs/mpv-android-lib-v0.0.4.aar
          # quick integrity: zip listing
          unzip -l app/libs/mpv-android-lib-v0.0.4.aar | grep -E 'libmpv.so|classes.jar' | head

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || secrets.STORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_PASSWORD:-}"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=../release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > local.properties

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build leanback release APKs (arm64 + armv7)
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
        run: |
          ./gradlew assembleLeanbackArm64_v8aRelease assembleLeanbackArmeabi_v7aRelease \
            --no-daemon --build-cache --max-workers=2 --console=plain

      - name: Collect APKs
        id: apks
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t files < <(find app/build/outputs/apk -path '*/release/*.apk' -type f)
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do
            base=$(basename "$f")
            cp -v "$f" "dist/$base"
            ls -lh "dist/$base"
          done
          echo "count=${#files[@]}" >>"$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: dist/*.apk
          retention-days: 14

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Test APK — ${{ inputs.ref }}"
          body: |
            Test build (disposable keystore, **not** production signing).

            - Branch/ref: `${{ inputs.ref }}`
            - mpv AAR: `${{ inputs.mpv_aar_url }}`
            - Features: MPV hot soft/hard decode, Dolby master switch, HDR/vulkan options

            Install the matching ABI APK on a device/emulator for manual verification.
          files: dist/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
