name: Build Test APK

# Signed test APK for feature validation. Uses repo secrets for a disposable test keystore.
# Signed test APK. By default KEEPS the mpv AAR from the git branch (v0.0.3 works with
# current MpvPlayer). Optional inject only when mpv_aar_url is non-empty.
# Do NOT inject hybrid/mismatched AARs — they crash with NoSuchMethodError event(I)V.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        default: "feat/mpv-hot-decode-dolby-hdr"
      mpv_aar_url:
        description: "Optional URL to inject over app/libs mpv AAR (leave empty = use git AAR)"
        required: false
        default: ""
      release_tag:
        description: "GitHub release tag to upload APKs"
        required: true
        default: "test-apk-mpv-hot-decode"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Checkout Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: release-1.10.1-fongmi
          path: .media3
          fetch-depth: 1

      - name: Limit Media3 composite modules
        run: cp .github/media3-composite-settings.gradle .media3/settings.gradle

      - name: Resolve mpv AAR
        run: |
          set -euo pipefail
          mkdir -p app/libs
          URL="${{ inputs.mpv_aar_url }}"
          if [ -n "$URL" ]; then
            echo "Injecting external AAR from $URL"
            rm -f app/libs/mpv-android-lib-*.aar
            curl -fL --retry 5 -o app/libs/mpv-android-lib-injected.aar "$URL"
          else
            echo "Using mpv AAR from git tree (no inject)"
          fi
          ls -lh app/libs/mpv-android-lib-*.aar
          AAR=$(ls app/libs/mpv-android-lib-*.aar | head -1)
          unzip -l "$AAR" | grep -E 'libmpv.so|libplayer.so|classes.jar' | head
          # Fail fast if classes.jar lacks event(I,MPVNode) while so looks for wrong sig —
          # extract and javap if possible
          STAGE=$(mktemp -d)
          unzip -q "$AAR" classes.jar -d "$STAGE"
          if command -v javap >/dev/null; then
            javap -classpath "$STAGE/classes.jar" -public is.xyz.mpv.MPVLib | tee /tmp/mpvlib-public.txt
            if ! grep -q 'event(int, is.xyz.mpv.MPVNode)' /tmp/mpvlib-public.txt \
               && ! grep -q 'event(int)' /tmp/mpvlib-public.txt; then
              echo "WARN: MPVLib.event not found in classes.jar"
            fi
          fi

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || secrets.STORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_PASSWORD:-}"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=../release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > local.properties

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build leanback release APKs (arm64 + armv7)
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
        run: |
          ./gradlew assembleLeanbackArm64_v8aRelease assembleLeanbackArmeabi_v7aRelease \
            --no-daemon --build-cache --max-workers=2 --console=plain

      - name: Collect APKs
        id: apks
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t files < <(find app/build/outputs/apk -path '*/release/*.apk' -type f)
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do
            base=$(basename "$f")
            cp -v "$f" "dist/$base"
            ls -lh "dist/$base"
          done
          echo "count=${#files[@]}" >>"$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: dist/*.apk
          retention-days: 14

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Test APK — ${{ inputs.ref }}"
          body: |
            Test build (disposable keystore, **not** production signing).

            - Branch/ref: `${{ inputs.ref }}`
            - mpv AAR: `${{ inputs.mpv_aar_url || 'from git (app/libs)' }}`
            - Features: MPV hot soft/hard decode, Dolby master switch, HDR/vulkan options (Java-side)
            - Note: stock git AAR is v0.0.3-compatible with MpvPlayer EventObserver

            Install the matching ABI APK on a device/emulator for manual verification.
          files: dist/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
