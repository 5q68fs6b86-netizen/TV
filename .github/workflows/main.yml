name: Build and Upload APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Grant gradlew permission
      run: chmod +x ./gradlew

    - name: Build APKs
      run: |
        ./gradlew assembleLeanbackPythonArm64_v8aRelease
        ./gradlew assembleLeanbackPythonArmeabi_v7aRelease

    - name: Verify APKs exist
      id: apk-check
      run: |
        apk_exists=false
        if [ -f app/build/outputs/apk/leanback/python/arm64_v8a/release/leanback-python-arm64_v8a.apk ]; then
          echo "Found leanback-python-arm64_v8a.apk"
          apk_exists=true
        fi
        if [ -f app/build/outputs/apk/leanback/python/armeabi_v7a/release/leanback-python-armeabi_v7a.apk ]; then
          echo "Found leanback-python-armeabi_v7a.apk"
          apk_exists=true
        fi
        if [ "$apk_exists" = "true" ]; then
          echo "apk_exists=true" >> $GITHUB_OUTPUT
        else
          echo "Required APKs not found!" >&2
          exit 1
        fi

    - name: Upload APKs
      if: steps.apk-check.outputs.apk_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Release-APKs
        path: app/build/outputs/apk/leanback/python/*/release/leanback-python-*.apk
        retention-days: 7
