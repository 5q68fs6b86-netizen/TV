name: Build mpv-android-lib AAR

# Same-source AAR: marlboro-advance/mpvlibAndroid (extended JNI matching TV's MpvPlayer)
# + wobuhui666/mpv (fongmi) as the libmpv core (vulkan / HDR path).
#
# This replaces the broken hybrid graft (new libmpv + old libplayer) which caused
# black screens / exit hangs from ABI mismatch.

on:
  workflow_dispatch:
    inputs:
      mpv_git_url:
        description: "libmpv git URL"
        required: true
        default: "https://github.com/wobuhui666/mpv"
      mpv_ref:
        description: "libmpv ref (branch/tag/sha)"
        required: true
        default: "fongmi"
      mpvlib_android_ref:
        description: "marlboro-advance/mpvlibAndroid ref (JNI + classes.jar source)"
        required: true
        default: "library"
      aar_version:
        description: "Output AAR version suffix"
        required: true
        default: "0.0.6"
      arches:
        description: "Space-separated arches for buildall (arm64 armv7l ...)"
        required: true
        default: "arm64 armv7l"
      publish_release:
        description: "Publish GitHub Release (true/false)"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout mpvlibAndroid (extended JNI)
        uses: actions/checkout@v4
        with:
          repository: marlboro-advance/mpvlibAndroid
          ref: ${{ inputs.mpvlib_android_ref }}
          path: mpvlib
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build cmake python3-pip gperf nasm yasm binutils
          sudo pip3 install --break-system-packages meson || sudo pip3 install meson

      - name: Export cache id
        working-directory: mpvlib
        run: |
          chmod +x buildscripts/include/ci.sh buildscripts/download.sh buildscripts/buildall.sh
          # ci.sh export may assume certain layout; still useful for CACHE_IDENTIFIER
          if buildscripts/include/ci.sh export >>"$GITHUB_ENV" 2>/dev/null; then
            echo "ci export ok"
          else
            echo "CACHE_IDENTIFIER=mpvlib-${{ inputs.mpv_ref }}-${{ inputs.mpvlib_android_ref }}" >>"$GITHUB_ENV"
          fi

      - name: Cache native prefix
        uses: actions/cache@v4
        with:
          path: mpvlib/buildscripts/prefix
          # Bump suffix when prefix layout patches change (avoids half-broken cache).
          key: mpvlib-prefix-v3-${{ inputs.mpv_ref }}-${{ inputs.mpvlib_android_ref }}-${{ inputs.arches }}
          restore-keys: |
            mpvlib-prefix-v3-${{ inputs.mpv_ref }}-

      - name: Patch download-deps to use wobuhui666/mpv
        working-directory: mpvlib
        env:
          MPV_GIT_URL: ${{ inputs.mpv_git_url }}
          MPV_GIT_REF: ${{ inputs.mpv_ref }}
        run: |
          set -euo pipefail
          # Replace stock mpv-player/mpv clone with our fork + pin ref.
          # Original:
          #   [ ! -d mpv ] && git clone https://github.com/mpv-player/mpv
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("buildscripts/include/download-deps.sh")
          text = p.read_text()
          url = os.environ["MPV_GIT_URL"]
          ref = os.environ["MPV_GIT_REF"]
          block = f'''# mpv (patched by TV build-mpv-lib.yml)
          if [ ! -d mpv ]; then
          	git clone "{url}" mpv
          	git -C mpv checkout "{ref}"
          else
          	# Ensure CI cache reuse still ends on requested ref
          	git -C mpv fetch --depth 1 origin "{ref}" || git -C mpv fetch origin "{ref}" || true
          	git -C mpv checkout "{ref}" || git -C mpv checkout FETCH_HEAD || true
          fi
          '''
          import re
          text2, n = re.subn(
              r"# mpv\n\[ ! -d mpv \] && git clone https://github.com/mpv-player/mpv\n",
              block + "\n",
              text,
              count=1,
          )
          if n != 1:
              # fallback: append override after any mpv clone line
              if "git clone" in text and "mpv-player/mpv" in text:
                  text2 = text.replace(
                      "[ ! -d mpv ] && git clone https://github.com/mpv-player/mpv",
                      f'if [ ! -d mpv ]; then git clone "{url}" mpv; fi\ngit -C mpv fetch origin "{ref}" || true\ngit -C mpv checkout "{ref}" || true',
                  )
              else:
                  raise SystemExit("could not patch download-deps.sh for custom mpv")
          p.write_text(text2)
          print("patched download-deps.sh for", url, ref)
          PY
          # Also patch ci.sh tarball fetch of mpv master if present
          if grep -q 'mpv-player/mpv/archive' buildscripts/include/ci.sh 2>/dev/null; then
            sed -i "s|https://github.com/mpv-player/mpv/archive/master.tar.gz|${MPV_GIT_URL}/archive/${MPV_GIT_REF}.tar.gz|g" buildscripts/include/ci.sh || true
          fi
          grep -n "mpv" buildscripts/include/download-deps.sh | tail -20

      - name: Download SDK/deps
        working-directory: mpvlib
        env:
          IN_CI: "1"
        run: |
          set -euo pipefail
          find buildscripts -type f -name '*.sh' -exec chmod +x {} +
          # Prefer project's download.sh (pulls NDK/SDK + deps)
          cd buildscripts
          ./download.sh
          # Ensure mpv is on requested ref after download
          if [ -d deps/mpv ]; then
            git -C deps/mpv remote -v || true
            git -C deps/mpv log -1 --oneline || true
            git -C deps/mpv rev-parse HEAD || true
          fi

      - name: Patch Android API 24 + vulkan.pc for NDK
        working-directory: mpvlib
        run: |
          set -euo pipefail
          # apilvl 21 has no libvulkan.so; need 24+.
          sed -i 's/local apilvl=21/local apilvl=24/' buildscripts/buildall.sh
          grep -n 'apilvl' buildscripts/buildall.sh | head -5

          # libplacebo: do not require link-time vkGetInstanceProcAddr
          sed -i 's/-Dvk-proc-addr=enabled/-Dvk-proc-addr=disabled/' buildscripts/scripts/libplacebo.sh

          # Replace stock vulkan.pc generator in mpv.sh with one that -L points at NDK sysroot.
          # Keep original file then overwrite the vulkan.pc block via a post-hook append.
          if ! grep -q 'vulkan.pc fixed' buildscripts/scripts/mpv.sh; then
            # Insert fixup right after the END of the stock vulkan.pc heredoc.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("buildscripts/scripts/mpv.sh")
          t = p.read_text()
          fix = r'''
          # --- TV patch: point vulkan.pc at NDK sysroot libvulkan.so (API 24+) ---
          _ndk_llvm="$(find "$PWD" "$PWD/.." "$PWD/../.." -type d -path '*/android-ndk-*/toolchains/llvm/prebuilt/linux-x86_64' 2>/dev/null | head -1)"
          if [ -n "$_ndk_llvm" ]; then
            for api in 24 26 28 29 30 31 33 34 35; do
              d="$_ndk_llvm/sysroot/usr/lib/${ndk_triple}/${api}"
              if [ -f "$d/libvulkan.so" ]; then
                {
                  echo "Name: Vulkan"
                  echo "Description: Android NDK Vulkan"
                  echo "Version: 1.3.275"
                  echo "Libs: -L${d} -lvulkan"
                  echo "Cflags: -I${_ndk_llvm}/sysroot/usr/include"
                } >"$prefix_dir/lib/pkgconfig/vulkan.pc"
                echo "vulkan.pc fixed -> $d/libvulkan.so"
                break
              fi
            done
          fi
          # --- end TV patch ---
          '''
          marker = "END\n\nunset CC CXX # meson wants these unset"
          if marker not in t:
              marker2 = "END\n\nunset CC CXX"
              if marker2 not in t:
                  raise SystemExit("mpv.sh marker not found")
              t = t.replace(marker2, "END\n" + fix + "\nunset CC CXX", 1)
          else:
              t = t.replace(marker, "END\n" + fix + "\nunset CC CXX # meson wants these unset", 1)
          p.write_text(t)
          print("mpv.sh patched")
          PY
          fi
          # Same fix for libplacebo configure time: write a helper sourced before meson
          if ! grep -q 'vulkan.pc fixed' buildscripts/scripts/libplacebo.sh; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("buildscripts/scripts/libplacebo.sh")
          t = p.read_text()
          inject = r'''
          # --- TV patch: vulkan.pc before libplacebo meson ---
          mkdir -p "$prefix_dir"/lib/pkgconfig
          _ndk_llvm="$(find "$PWD" "$PWD/.." "$PWD/../.." -type d -path '*/android-ndk-*/toolchains/llvm/prebuilt/linux-x86_64' 2>/dev/null | head -1)"
          if [ -n "$_ndk_llvm" ]; then
            for api in 24 26 28 29 30 31 33 34 35; do
              d="$_ndk_llvm/sysroot/usr/lib/${ndk_triple}/${api}"
              if [ -f "$d/libvulkan.so" ]; then
                {
                  echo "Name: Vulkan"
                  echo "Description: Android NDK Vulkan"
                  echo "Version: 1.3.275"
                  echo "Libs: -L${d} -lvulkan"
                  echo "Cflags: -I${_ndk_llvm}/sysroot/usr/include"
                } >"$prefix_dir/lib/pkgconfig/vulkan.pc"
                echo "libplacebo vulkan.pc fixed -> $d/libvulkan.so"
                break
              fi
            done
          fi
          # --- end TV patch ---
          '''
          if "unset CC CXX" not in t:
              raise SystemExit("libplacebo.sh unexpected")
          t = t.replace("unset CC CXX", "unset CC CXX\n" + inject, 1)
          p.write_text(t)
          print("libplacebo.sh patched")
          PY
          fi
          echo '--- mpv.sh head ---'
          sed -n '1,60p' buildscripts/scripts/mpv.sh
          echo '--- libplacebo.sh ---'
          cat buildscripts/scripts/libplacebo.sh

      - name: Build native + AAR
        working-directory: mpvlib
        env:
          GRADLE_OPTS: -Xmx4G
        run: |
          set -euo pipefail
          unset ANDROID_SDK_ROOT || true
          find buildscripts -type f -name '*.sh' -exec chmod +x {} +
          chmod +x buildscripts/download.sh buildscripts/buildall.sh || true
          cd buildscripts
          # Do NOT pre-create prefix/* — buildall setup_prefix creates flat
          # usr/local symlinks; a half-made prefix breaks pkg-config (dav1d etc.).
          for arch in ${{ inputs.arches }}; do
            echo "===== building mpv for $arch ====="
            ./buildall.sh --arch "$arch" mpv
          done
          if ./buildall.sh -n; then
            echo "buildall -n ok"
          else
            echo "buildall -n failed, try plain buildall"
            ./buildall.sh
          fi
          find ../app/build/outputs -type f -name '*.aar' -ls || true
          find ../app -name 'libplayer.so' | head
          find ../app -name 'libmpv.so' | head

      - name: Verify AAR JNI surface + vulkan
        id: aar
        working-directory: mpvlib
        env:
          AAR_VERSION: ${{ inputs.aar_version }}
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs -type f -name '*.aar' | head -1)
          test -n "$SRC"
          test -f "$SRC"
          OUT="$GITHUB_WORKSPACE/mpv-android-lib-v${AAR_VERSION}.aar"
          cp -f "$SRC" "$OUT"
          STAGE="$GITHUB_WORKSPACE/aar-check"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          unzip -q "$OUT" -d "$STAGE"
          test -f "$STAGE/classes.jar"
          REQUIRED_JNI=(
            Java_is_xyz_mpv_MPVLib_getPropertyNode
            Java_is_xyz_mpv_MPVLib_setPropertyNode
            Java_is_xyz_mpv_MPVLib_commandNode
            Java_is_xyz_mpv_MPVLib_grabThumbnailFast
            Java_is_xyz_mpv_MPVLib_clearThumbnailCache
            Java_is_xyz_mpv_MPVLib_setThumbnailJavaVM
          )
          declare -A SEEN_ABIS=()
          for arch in ${{ inputs.arches }}; do
            case "$arch" in
              arm64|aarch64|arm64-v8a) abi=arm64-v8a ;;
              armv7l|armv7|armeabi-v7a) abi=armeabi-v7a ;;
              x86) abi=x86 ;;
              x86_64) abi=x86_64 ;;
              *) echo "FATAL: unsupported requested arch: $arch" >&2; exit 1 ;;
            esac
            [ -z "${SEEN_ABIS[$abi]:-}" ] || continue
            SEEN_ABIS[$abi]=1

            PLAYER="$STAGE/jni/$abi/libplayer.so"
            MPV="$STAGE/jni/$abi/libmpv.so"
            test -f "$PLAYER" || { echo "FATAL: $abi libplayer.so missing" >&2; exit 1; }
            test -f "$MPV" || { echo "FATAL: $abi libmpv.so missing" >&2; exit 1; }
            NM="$GITHUB_WORKSPACE/nm-libplayer-${abi}.txt"
            nm -D "$PLAYER" >"$NM"
            for sym in "${REQUIRED_JNI[@]}"; do
              if ! grep -qE "[[:space:]]T[[:space:]]+${sym}(@@|\$)" "$NM"; then
                echo "FATAL: $abi libplayer.so missing $sym"
                head -40 "$NM" || true
                exit 1
              fi
            done
            echo "$abi JNI surface OK (${#REQUIRED_JNI[@]} extended methods)."

            if readelf -d "$MPV" | grep -q 'libvulkan.so'; then
              echo "$abi libmpv depends on libvulkan.so"
            else
              echo "WARN: $abi libmpv has no libvulkan.so NEEDED entry"
            fi
          done

          {
            echo "Same-source AAR notes"
            echo "====================="
            echo "Output: mpv-android-lib-v${AAR_VERSION}.aar"
            echo "JNI + classes.jar: marlboro-advance/mpvlibAndroid@${{ inputs.mpvlib_android_ref }}"
            echo "libmpv core: ${{ inputs.mpv_git_url }}@${{ inputs.mpv_ref }}"
            echo "Arches: ${{ inputs.arches }}"
            echo ""
            for abi in "${!SEEN_ABIS[@]}"; do
              echo "$abi:"
              ls -lh "$STAGE/jni/$abi/"
              echo ""
            done
          } | tee "$GITHUB_WORKSPACE/INSTALL_MPV_AAR.txt"

          ls -lh "$OUT"
          echo "aar_path=$OUT" >>"$GITHUB_OUTPUT"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-lib-v${{ inputs.aar_version }}
          path: |
            mpv-android-lib-v${{ inputs.aar_version }}.aar
            INSTALL_MPV_AAR.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AAR_VERSION: ${{ inputs.aar_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="mpv-lib-v${AAR_VERSION}"
          AAR="mpv-android-lib-v${AAR_VERSION}.aar"
          NOTES=$(cat INSTALL_MPV_AAR.txt)
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$AAR" INSTALL_MPV_AAR.txt \
            --repo "$REPO" \
            --title "mpv-android-lib v${AAR_VERSION} (same-source mpvlibAndroid + wobuhui666/mpv)" \
            --notes "$NOTES" \
            --latest=false
          echo "Published https://github.com/${REPO}/releases/tag/$TAG"
