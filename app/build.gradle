plugins {
    id 'com.android.application'
    // 确保你的项目也应用了 Kotlin 插件 (通常在顶级 build.gradle 或 settings.gradle)
    // 如果没有，需要添加： id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fongmi.android.tv'

    compileSdk 35
    flavorDimensions = ["mode", "api", "abi"]

    defaultConfig {
        applicationId "com.fongmi.android.tv"
        minSdk 21
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28 // 注意: targetSdk 28 非常旧，强烈建议升级到至少 33 或 34 以支持新特性和安全要求
        versionCode 258
        versionName "2.5.8"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        java {
            dimension "api"
        }
        python {
            dimension "api"
        }
        x86 {
            dimension "abi"
            ndk { abiFilters "x86" }
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        compose true // <--- *** 添加: 启用 Compose ***
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // --- *** 添加: Compose 可能需要的 Proguard 规则 *** ---
            // 查看官方文档获取最新的 Compose Proguard 规则:
            // https://developer.android.com/jetpack/compose/setup#add-compose-compiler-dependency
            // 通常 BoM 会处理，但有时需要显式添加
            // proguardFiles(path-to-your-compose-rules)/compose-rules.pro
        }
    }

    packagingOptions {
        exclude 'META-INF/beans.xml'
        // --- *** 添加: Compose UI 需要的资源排除规则 *** ---
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // --- *** 添加: Compose Options *** ---
    composeOptions {
        // 设置与你的 Kotlin 版本兼容的 Compose Compiler 版本
        // 示例: 如果你的 Kotlin 版本是 1.9.10, 通常使用 1.5.3
        // 请根据你的实际 Kotlin 版本查阅官方文档来确定正确的版本
        kotlinCompilerExtensionVersion = "1.5.3" // <--- *** 确认这个版本与你的 Kotlin 版本兼容 ***
    }
    // --- *** 结束: Compose Options *** ---


    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "${variant.productFlavors[0].name}-${variant.productFlavors[1].name}-${variant.productFlavors[2].name}.apk"
        }
    }

    android.applicationVariants.all { variant ->
        if (variant.buildType.name == 'release' && variant.productFlavors[0].name == 'mobile') {
            variant.mergeAssets.doLast {
                delete(fileTree(dir: variant.mergeAssets.outputDir, includes: ['x5.tbs.apk']))
            }
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            // 使用变量定义 okhttpVersion
            def okhttpVersionFromProject = project.hasProperty('okhttpVersion') ? project.property('okhttpVersion') : '4.11.0' // 提供一个默认值
            force 'com.squareup.okhttp3:okhttp:' + okhttpVersionFromProject
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
    }
}

dependencies {
    // --- 项目模块 ---
    implementation project(':hook')
    implementation project(':tvbus')
    implementation project(':zlive')
    implementation project(':catvod')
    implementation project(':quickjs')
    implementation project(':thunder')
    implementation project(':youtube')
    implementation project(':jianpian')
    implementation project(':forcetech')
    implementation project(':ijkplayer')

    // --- Glide ---
    implementation 'com.github.bumptech.glide:glide:4.16.0' // 保持你现有的版本
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0' // 保持你现有的版本

    // --- AndroidX & Google ---
    implementation 'androidx.cardview:cardview:1.0.0'
    // 使用变量定义 media3Version
    def media3VersionFromProject = project.hasProperty('media3Version') ? project.property('media3Version') : '1.2.0' // 提供一个默认值
    implementation 'androidx.media3:media3-datasource-okhttp:' + media3VersionFromProject
    implementation 'androidx.media3:media3-datasource-rtmp:' + media3VersionFromProject
    implementation 'androidx.media3:media3-exoplayer:' + media3VersionFromProject
    implementation 'androidx.media3:media3-exoplayer-dash:' + media3VersionFromProject
    implementation 'androidx.media3:media3-exoplayer-hls:' + media3VersionFromProject
    implementation 'androidx.media3:media3-exoplayer-rtsp:' + media3VersionFromProject
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:' + media3VersionFromProject
    implementation 'androidx.media3:media3-ui:' + media3VersionFromProject
    implementation 'androidx.appcompat:appcompat:1.7.0' // 保持最新
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'

    // --- Jetpack Compose 核心依赖 ---
    def composeBomVersion = "2023.10.01" // 使用一个较新的稳定 BoM 版本, 或根据你的需求调整
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    androidTestImplementation platform("androidx.compose:compose-bom:$composeBomVersion") // Test BoM

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3' // 使用 BoM 管理版本
    implementation 'androidx.activity:activity-compose:1.8.1' // 使用最新的稳定版本
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2' // 如果需要 ViewModel 集成

    // --- Jetpack Compose for TV 依赖 ---
    def tvVersion = "1.0.0-alpha10" // 使用最新的 TV Compose 版本
    implementation "androidx.tv:tv-foundation:$tvVersion"
    implementation "androidx.tv:tv-material:$tvVersion"

    // --- 其他第三方库 (保持不变) ---
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    implementation('com.github.anilbeesetti.nextlib:nextlib-media3ext:0.8.2') { exclude group: 'androidx.media3', module: 'media3-exoplayer' }
    implementation 'com.github.bassaer:materialdesigncolors:1.0.0'
    implementation 'com.github.bumptech.glide:annotations:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    implementation 'com.github.jahirfiquitiva:TextDrawable:1.0.3'
    implementation 'com.github.thegrizzlylabs:sardine-android:0.9'
    implementation 'com.github.YarikSOffice:lingver:1.3.0'
    implementation 'com.google.net.cronet:cronet-okhttp:0.1.0'
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'com.guolindev.permissionx:permissionx:1.8.0'
    implementation 'com.hierynomus:smbj:0.13.0'
    implementation 'com.tencent.tbs:tbssdk:44286'
    implementation 'javax.servlet:javax.servlet-api:3.1.0'
    implementation 'org.chromium.net:cronet-embedded:76.3809.111'
    implementation 'org.eclipse.jetty:jetty-client:8.1.22.v20160922'
    implementation('org.eclipse.jetty:jetty-server:8.1.22.v20160922') { exclude group: 'org.eclipse.jetty.orbit', module: 'javax.servlet' }
    implementation('org.eclipse.jetty:jetty-servlet:8.1.22.v20160922') { exclude group: 'org.eclipse.jetty.orbit', module: 'javax.servlet' }
    implementation 'org.fourthline.cling:cling-core:2.1.2-SNAPSHOT'
    implementation 'org.fourthline.cling:cling-support:2.1.2-SNAPSHOT'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation('org.simpleframework:simple-xml:2.7.1') { exclude group: 'stax', module: 'stax-api' exclude group: 'xpp3', module: 'xpp3' }
    implementation(ext: 'aar', name: 'danmaku', group: 'fongmi', version: 'release')
    implementation(ext: 'aar', name: 'dlna-core-release', group: 'fongmi', version: 'release')
    implementation(ext: 'aar', name: 'dlna-dmc-release', group: 'fongmi', version: 'release')
    implementation(ext: 'aar', name: 'dlna-dmr-release', group: 'fongmi', version: 'release')

    // --- Leanback 特定依赖 (保持不变) ---
    leanbackImplementation 'androidx.leanback:leanback:1.2.0-alpha04'
    leanbackImplementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    leanbackImplementation 'com.github.JessYanCoding:AndroidAutoSize:1.2.1'

    // --- Mobile 特定依赖 (保持不变) ---
    mobileImplementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    mobileImplementation 'com.google.android.flexbox:flexbox:3.0.0'
    mobileImplementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }

    // --- Annotation Processors (保持不变) ---
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // --- Compose 测试和调试 (可选，建议添加) ---
    androidTestImplementation "androidx.compose.ui:ui-test-junit4" // 使用 BoM 管理版本
    debugImplementation "androidx.compose.ui:ui-tooling" // 使用 BoM 管理版本
    debugImplementation "androidx.compose.ui:ui-test-manifest" // 使用 BoM 管理版本
}