name: Build mpv-android-lib AAR

# Rebuild native mpv AAR for app/libs using wobuhui666/mpv (fongmi branch).
# Local machines that cannot run NDK builds should use this workflow and download the artifact.

on:
  workflow_dispatch:
    inputs:
      mpv_ref:
        description: "wobuhui666/mpv ref (branch/tag/sha)"
        required: true
        default: "fongmi"
      mpv_android_ref:
        description: "wobuhui666/mpv-android ref"
        required: true
        default: "fongmi"
      aar_version:
        description: "Output AAR version suffix (e.g. 0.0.4)"
        required: true
        default: "0.0.4"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout mpv-android build tree
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/mpv-android
          ref: ${{ inputs.mpv_android_ref }}
          path: mpv-android
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Export cache id
        working-directory: mpv-android
        run: |
          chmod +x buildscripts/include/ci.sh
          buildscripts/include/ci.sh export >>"$GITHUB_ENV"

      - name: Cache native prefix
        uses: actions/cache@v4
        with:
          path: mpv-android/gh-cache/
          key: mpv-prefix-${{ env.CACHE_IDENTIFIER }}-${{ inputs.mpv_ref }}
          restore-keys: |
            mpv-prefix-${{ env.CACHE_IDENTIFIER }}-

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build cmake python3-pip gperf nasm yasm
          sudo pip3 install --break-system-packages meson || sudo pip3 install meson

      - name: Download SDK/NDK + deps (use wobuhui666/mpv)
        working-directory: mpv-android
        env:
          MPV_GIT_URL: https://github.com/wobuhui666/mpv
          MPV_GIT_REF: ${{ inputs.mpv_ref }}
          MPV_ANDROID_ARCHES: armv7l arm64
          CACHE_MODE: folder
          CACHE_FOLDER: ${{ github.workspace }}/mpv-android/gh-cache
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install

      - name: Build native libraries
        working-directory: mpv-android
        env:
          MPV_GIT_URL: https://github.com/wobuhui666/mpv
          MPV_GIT_REF: ${{ inputs.mpv_ref }}
          MPV_ANDROID_ARCHES: armv7l arm64
          MPV_ANDROID_NATIVE_ONLY: "1"
        run: buildscripts/include/ci.sh build

      - name: Locate produced native libs
        id: libs
        working-directory: mpv-android
        run: |
          set -e
          echo "Produced libs:"
          find app -type d -name 'arm64-v8a' -o -type d -name 'armeabi-v7a' 2>/dev/null | head
          find app -name 'libmpv.so' 2>/dev/null | head
          # Common output locations in mpv-android builds
          for d in \
            app/src/main/libs \
            app/src/main/jniLibs \
            app/build/intermediates/merged_native_libs \
            app/build/intermediates/stripped_native_libs
          do
            if [ -d "$d" ]; then echo "DIR $d"; find "$d" -name 'libmpv.so' | head; fi
          done
          # Prefer app/src/main/libs if present (FongMi workflow uploads this)
          if [ -d app/src/main/libs ]; then
            echo "libs_root=app/src/main/libs" >>"$GITHUB_OUTPUT"
          elif [ -d app/src/main/jniLibs ]; then
            echo "libs_root=app/src/main/jniLibs" >>"$GITHUB_OUTPUT"
          else
            # fallback: first directory containing libmpv.so
            root=$(find app -name 'libmpv.so' | head -1 | xargs -r dirname | xargs -r dirname)
            echo "libs_root=$root" >>"$GITHUB_OUTPUT"
          fi
          echo "Resolved libs_root=$(cat $GITHUB_OUTPUT | grep libs_root)"

      - name: Checkout TV base AAR (Java bindings / assets)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: tv
          sparse-checkout: |
            app/libs
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Package AAR for TV app/libs
        env:
          AAR_VERSION: ${{ inputs.aar_version }}
        run: |
          set -euo pipefail
          LIBS_ROOT="mpv-android/${{ steps.libs.outputs.libs_root }}"
          # steps.libs.outputs may already be relative to mpv-android
          if [ ! -d "$LIBS_ROOT" ]; then
            LIBS_ROOT="${{ steps.libs.outputs.libs_root }}"
            if [ -d "mpv-android/$LIBS_ROOT" ]; then LIBS_ROOT="mpv-android/$LIBS_ROOT"; fi
          fi
          test -d "$LIBS_ROOT"
          BASE_AAR=$(ls tv/app/libs/mpv-android-lib-*.aar | head -1)
          test -f "$BASE_AAR"
          STAGE="$GITHUB_WORKSPACE/aar-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          unzip -q "$BASE_AAR" -d "$STAGE"
          # Replace native libs; keep classes.jar / assets / manifest from base AAR
          rm -rf "$STAGE/jni"
          mkdir -p "$STAGE/jni"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -d "$LIBS_ROOT/$abi" ]; then
              mkdir -p "$STAGE/jni/$abi"
              cp -a "$LIBS_ROOT/$abi/." "$STAGE/jni/$abi/"
            fi
          done
          if [ ! -d "$STAGE/jni/arm64-v8a" ] && [ -d "$LIBS_ROOT/arm64" ]; then
            mkdir -p "$STAGE/jni/arm64-v8a"
            cp -a "$LIBS_ROOT/arm64/." "$STAGE/jni/arm64-v8a/"
          fi
          if [ ! -d "$STAGE/jni/armeabi-v7a" ] && [ -d "$LIBS_ROOT/armv7l" ]; then
            mkdir -p "$STAGE/jni/armeabi-v7a"
            cp -a "$LIBS_ROOT/armv7l/." "$STAGE/jni/armeabi-v7a/"
          fi
          test -f "$STAGE/jni/arm64-v8a/libmpv.so"
          test -f "$STAGE/classes.jar"
          OUT="$GITHUB_WORKSPACE/mpv-android-lib-v${AAR_VERSION}.aar"
          (cd "$STAGE" && jar cf "$OUT" .)
          ls -lh "$OUT"
          cat >"$GITHUB_WORKSPACE/INSTALL_MPV_AAR.txt" <<EOF
          Replace in TV repo:
            app/libs/mpv-android-lib-v0.0.3.aar
          with:
            mpv-android-lib-v${AAR_VERSION}.aar
          Source: wobuhui666/mpv@${{ inputs.mpv_ref }}
          Build tree: wobuhui666/mpv-android@${{ inputs.mpv_android_ref }}
          Base Java bindings: ${BASE_AAR}
          EOF

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-lib-v${{ inputs.aar_version }}
          path: |
            mpv-android-lib-v${{ inputs.aar_version }}.aar
            INSTALL_MPV_AAR.txt
          if-no-files-found: error
          retention-days: 14
