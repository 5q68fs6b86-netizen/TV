name: Build and Upload APKs signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Grant gradlew permission
      run: chmod +x ./gradlew

    - name: Build APKs
      run: |
         ./gradlew assembleLeanbackPythonArm64_v8aRelease
         ./gradlew assembleLeanbackPythonArmeabi_v7aRelease

    - name: Encode Keystore
      id: encode_keystore
      run: echo "keystore_b64=$(base64 -w 0 114514.jks)" >> $GITHUB_OUTPUT

    - name: Sign arm64-v8a APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/leanbackPythonArm64_v8a/release
        signingKeyBase64: ${{ steps.encode_keystore.outputs.keystore_b64 }}
        alias: '114514'
        keyStorePassword: '114514'
        keyPassword: '114514'

    - name: Sign armeabi-v7a APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/leanbackPythonArmeabi_v7a/release
        signingKeyBase64: ${{ steps.encode_keystore.outputs.keystore_b64 }}
        alias: '114514'
        keyStorePassword: '114514'
        keyPassword: '114514'

    - name: Verify APKs exist
      id: apk-check
      run: |
        ls app/build/outputs/apk
        if ls app/build/outputs/apk/**/*release/*.apk 1> /dev/null 2>&1; then
          echo "apk_exists=true" >> $GITHUB_OUTPUT
        else
          echo "APK not found!" >&2
          exit 1
        fi

    - name: Create Release
      if: steps.apk-check.outputs.apk_exists == 'true'
      uses: softprops/action-gh-release@v1
      with:
        name: "Release ${{ github.run_number }}"
        tag_name: "v${{ github.run_number }}"
        files: |
          app/build/outputs/apk/**/*release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
